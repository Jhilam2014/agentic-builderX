services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: agentic-builderx-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8080}
      - VITE_GENERATED_SITE_URL=${VITE_GENERATED_SITE_URL:-http://localhost:5174}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend
      - generated-site
    networks:
      - builderx

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.142.2}
    container_name: agentic-builderx-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      # Codex CLI starts its browser OAuth callback server on localhost:1455.
      # Expose the same port from the backend container so the host browser can
      # complete the redirect at http://localhost:1455/auth/callback.
      - "${CODEX_LOGIN_CALLBACK_PORT:-1455}:${CODEX_LOGIN_CALLBACK_PROXY_PORT:-1456}"
    environment:
      - PORT=8080
      - GENERATED_SITE_DIR=/workspace/generated-site
      - GENERATED_SITE_URL=${VITE_GENERATED_SITE_URL:-http://localhost:5174}
      - GENERATED_SITE_INTERNAL_URL=http://generated-site:5174
      - GENERATED_SITE_CONTAINER=agentic-builderx-generated-site
      - RESTART_GENERATED_CONTAINER=${RESTART_GENERATED_CONTAINER:-false}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - WORKFLOW_RUNTIME_LOG_PATH=/workspace/runtime/workflow-runtime-log.jsonl
      - PROJECTS_ROOT=/workspace/money/apps
      - PROJECTS_REGISTRY_PATH=/workspace/project/runtime/projects.json
      - PROJECT_EXPORTS_ROOT=/workspace/project/runtime/exports
      - PROJECTS_GITIGNORE_PATH=/workspace/money/.gitignore
      - PROJECT_PORT_START=${PROJECT_PORT_START:-5300}
      - PROJECT_PORT_END=${PROJECT_PORT_END:-5399}
      - PROJECT_PREVIEW_PORT_RETRY_TIMEOUT_MS=${PROJECT_PREVIEW_PORT_RETRY_TIMEOUT_MS:-120000}
      - PROJECT_SELECT_PREVIEW_TIMEOUT_MS=${PROJECT_SELECT_PREVIEW_TIMEOUT_MS:-15000}
      - PROJECT_HOST_URL=${PROJECT_HOST_URL:-http://localhost}
      - PROJECT_RUNTIME_MODE=${PROJECT_RUNTIME_MODE:-docker}
      - PROJECT_RUNTIME_IMAGE=${PROJECT_RUNTIME_IMAGE:-}
      - PROJECT_RUNTIME_NETWORK=${PROJECT_RUNTIME_NETWORK:-}
      - BUILDERX_PROJECT_ROOT=/workspace/project
      - BUILDERX_WORKSPACE_ROOT=/workspace/money
      - BUILDERX_BACKEND_CONTAINER=agentic-builderx-backend
      - CODEX_BIN=codex
      - CLAUDE_BIN=${CLAUDE_BIN:-claude}
      - AI_CLI_PROVIDER=${AI_CLI_PROVIDER:-auto}
      - AI_CLI_BIN=${AI_CLI_BIN:-}
      - CODEX_AUTH_MODE=${CODEX_AUTH_MODE:-existing_cli_session}
      - CODEX_PROFILES_ROOT=${CODEX_PROFILES_ROOT:-/home/agentic/.codex-profiles}
      - CODEX_PROFILE_REGISTRY_PATH=${CODEX_PROFILE_REGISTRY_PATH:-runtime/codex-profiles.json}
      - CODEX_LOGIN_CALLBACK_PORT=${CODEX_LOGIN_CALLBACK_PORT:-1455}
      - CODEX_LOGIN_CALLBACK_PROXY_PORT=${CODEX_LOGIN_CALLBACK_PROXY_PORT:-1456}
      - CODEX_DEFAULT_PROFILE_ID=${CODEX_DEFAULT_PROFILE_ID:-}
      - CODEX_PROFILE_SELECTION_MODE=${CODEX_PROFILE_SELECTION_MODE:-manual}
      - CODEX_ALLOW_AUTOMATIC_PROFILE_FALLBACK=${CODEX_ALLOW_AUTOMATIC_PROFILE_FALLBACK:-false}
      - CODEX_PROFILE_FALLBACK_ORDER=${CODEX_PROFILE_FALLBACK_ORDER:-}
      - CODEX_PROFILE_MAX_FALLBACK_ATTEMPTS=${CODEX_PROFILE_MAX_FALLBACK_ATTEMPTS:-1}
      - CODEX_PROFILE_LIMIT_COOLDOWN_MINUTES=${CODEX_PROFILE_LIMIT_COOLDOWN_MINUTES:-60}
      - CLAUDE_AUTH_MODE=${CLAUDE_AUTH_MODE:-existing_cli_session}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - AUTH_CALLBACK_BASE_URL=${AUTH_CALLBACK_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ALLOW_SHARED_PROVIDER_KEY_FALLBACK=${ALLOW_SHARED_PROVIDER_KEY_FALLBACK:-false}
      - EXISTING_CLI_SESSION_ISOLATED=${EXISTING_CLI_SESSION_ISOLATED:-false}
      - CODEX_WORKFLOW_TIMEOUT_MS=${CODEX_WORKFLOW_TIMEOUT_MS:-600000}
      - ORCHESTRATOR_ARCHIVE_PATH=${ORCHESTRATOR_ARCHIVE_PATH:-/workspace/project/orchestrator-temp/orchestrator-agent-001-main.zip}
      - ORCHESTRATOR_INSTALL_ENABLED=${ORCHESTRATOR_INSTALL_ENABLED:-true}
      - ORCHESTRATOR_BOOTSTRAP_ENABLED=${ORCHESTRATOR_BOOTSTRAP_ENABLED:-true}
      - ORCHESTRATOR_BOOTSTRAP_TIMEOUT_MS=${ORCHESTRATOR_BOOTSTRAP_TIMEOUT_MS:-900000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - .:/workspace/project
      - ..:/workspace/money
      - ./apps/generated-site:/workspace/generated-site
      - ./runtime:/workspace/runtime
      - ${CODEX_PROFILES_ROOT:-./runtime/codex-profiles}:/home/agentic/.codex-profiles
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - builderx

  generated-site:
    build:
      context: .
      dockerfile: apps/generated-site/Dockerfile
    container_name: agentic-builderx-generated-site
    ports:
      - "${GENERATED_SITE_PORT:-5174}:5174"
    volumes:
      - ./apps/generated-site:/workspace/generated-site
      - generated_site_node_modules:/workspace/generated-site/node_modules
    networks:
      - builderx

networks:
  builderx:
    driver: bridge

volumes:
  generated_site_node_modules:
