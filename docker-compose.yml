services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: agentic-builderx-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8080}
      - VITE_GENERATED_SITE_URL=${VITE_GENERATED_SITE_URL:-http://localhost:5174}
    depends_on:
      - backend
      - generated-site
    networks:
      - builderx

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.142.2}
    container_name: agentic-builderx-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - GENERATED_SITE_DIR=/workspace/generated-site
      - GENERATED_SITE_URL=${VITE_GENERATED_SITE_URL:-http://localhost:5174}
      - GENERATED_SITE_CONTAINER=agentic-builderx-generated-site
      - RESTART_GENERATED_CONTAINER=${RESTART_GENERATED_CONTAINER:-false}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - WORKFLOW_RUNTIME_LOG_PATH=/workspace/runtime/workflow-runtime-log.jsonl
      - CODEX_HOME=/workspace/codex-home
      - CODEX_BIN=codex
      - CODEX_WORKFLOW_TIMEOUT_MS=${CODEX_WORKFLOW_TIMEOUT_MS:-600000}
      - NODE_ENV=${NODE_ENV:-development}
    volumes:
      - .:/workspace/project
      - ./apps/generated-site:/workspace/generated-site
      - ./runtime:/workspace/runtime
      - ${HOME}/.codex:/workspace/codex-home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - builderx

  generated-site:
    build:
      context: .
      dockerfile: apps/generated-site/Dockerfile
    container_name: agentic-builderx-generated-site
    ports:
      - "${GENERATED_SITE_PORT:-5174}:5174"
    volumes:
      - ./apps/generated-site:/workspace/generated-site
      - generated_site_node_modules:/workspace/generated-site/node_modules
    networks:
      - builderx

networks:
  builderx:
    driver: bridge

volumes:
  generated_site_node_modules:
