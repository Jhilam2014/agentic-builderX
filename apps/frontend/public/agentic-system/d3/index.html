<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic BuilderX System Graph</title>
    <link rel="stylesheet" href="./agentic-system.css" />
  </head>
  <body>
    <main class="graph-page">
      <header class="graph-header">
        <div>
          <a class="back-link" href="/">← Back to BuilderX</a>
          <h1>Agentic System</h1>
          <p id="status">Loading topology...</p>
        </div>
        <div id="legend" aria-label="Node type legend"></div>
      </header>
      <section class="graph-workspace">
        <div id="graph" aria-label="Interactive agentic system graph">
          <div class="graph-controls" aria-label="Graph controls">
            <button id="zoom-in" type="button" title="Zoom in">+</button>
            <button id="zoom-out" type="button" title="Zoom out">−</button>
            <button id="fit-graph" type="button">Fit all</button>
            <button id="show-all-network" type="button">Show network</button>
            <button id="restart-force" type="button">Reheat</button>
            <button id="toggle-force" class="active" type="button" aria-pressed="true">Force on</button>
          </div>
        </div>
        <aside id="insight" class="insight-panel" aria-live="polite">
          <div class="insight-empty">
            <span>NODE INSIGHT</span>
            <h2>Explore the system</h2>
            <p>Select any node to inspect its purpose, status, metadata, and connections.</p>
          </div>
        </aside>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="./agentic-system-d3.js"></script>
  </body>
</html>
